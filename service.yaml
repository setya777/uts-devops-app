apiVersion: v1
kind: Service
metadata:
  name: uts-app-service
spec:
  selector:
    app: uts-web-app # Menghubungkan service ini dengan deployment di atas
  type: LoadBalancer # Menyediakan satu IP publik/gerbang utama penyeimbang beban
  ports:
  - protocol: TCP
    port: 80         # Port gerbang luar yang diakses pengguna
    targetPort: 3000 # Diteruskan ke port container aplikasi di dalam cluster